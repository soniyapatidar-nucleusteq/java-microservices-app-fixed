server.port=8082
spring.application.name=order-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/shop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shop}
# One connection per service: the shop's database plan allows each service a single session.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.pool-name=order-pool
management.endpoints.web.exposure.include=health,unified-metrics
inventory.base-url=${INVENTORY_BASE_URL:http://localhost:8081}
