server.port=8082
spring.application.name=order-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://pgbouncer:6432/shop?prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shop}
# The database is reached through PgBouncer, which holds the shop's ONE connection to Postgres
# and lends it to one transaction at a time. These pooled connections are sessions to PgBouncer.
# prepareThreshold=0: no server-side prepared statements, as transaction pooling requires.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.pool-name=order-pool
management.endpoints.web.exposure.include=health,unified-metrics
inventory.base-url=${INVENTORY_BASE_URL:http://localhost:8081}
