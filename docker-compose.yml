services:
  # The shop's one database, shared by both services (each keeps its own tables), reached only
  # through pgbouncer.
  # No volume: `docker compose down` starts it empty again.
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=shop
      - POSTGRES_USER=shop
      - POSTGRES_PASSWORD=shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  # The single connection to Postgres for the whole system: every service queries through it.
  pgbouncer:
    build:
      context: ./pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  inventory-service:
    build:
      context: ./inventory-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
    depends_on:
      pgbouncer:
        condition: service_started
    networks:
      - app-network

  order-service:
    build:
      context: ./order-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      # Checkout reserves and releases stock through inventory-service's API.
      - INVENTORY_BASE_URL=http://inventory-service:8081
    depends_on:
      pgbouncer:
        condition: service_started
      inventory-service:
        condition: service_started
    networks:
      - app-network
    volumes:
      # Lets /actuator/unified-metrics read this container's CPU and memory from the
      # Docker engine. Note: this gives the container full access to the Docker engine.
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  app-network:
    driver: bridge
