services:
  inventory-service:
    build:
      context: ./inventory-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
    networks:
      - app-network

  order-service:
    build:
      context: ./order-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      # Checkout reserves and releases stock through inventory-service's API.
      - INVENTORY_BASE_URL=http://inventory-service:8081
    depends_on:
      - inventory-service
    networks:
      - app-network
    volumes:
      # Lets /actuator/unified-metrics read this container's CPU and memory from the
      # Docker engine. Note: this gives the container full access to the Docker engine.
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  app-network:
    driver: bridge
