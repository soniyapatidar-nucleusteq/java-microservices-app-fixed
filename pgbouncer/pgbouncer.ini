;; The shop's database plan allows ONE connection to Postgres for the whole system.
;; Every service connects here; PgBouncer lends that one server connection to one
;; transaction at a time and queues the rest.
[databases]
shop = host=postgres port=5432 dbname=shop

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; transaction pooling: the server connection belongs to a client only while its transaction runs
pool_mode = transaction
default_pool_size = 1
min_pool_size = 0
reserve_pool_size = 0
max_db_connections = 1
max_client_conn = 200

; a query that cannot get the connection within 5 s is refused
query_wait_timeout = 5

; the JDBC driver sends these at connect time; PgBouncer passes them on as settings
ignore_startup_parameters = extra_float_digits,options

logfile =
log_connections = 0
log_disconnections = 1
stats_period = 60
